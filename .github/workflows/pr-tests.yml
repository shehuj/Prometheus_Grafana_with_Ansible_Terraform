name: PR Tests

on:
  pull_request:
    branches: [dev, main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'

permissions:
  contents: read
  pull-requests: write
  checks: write

env:
  TF_VERSION: '1.6.0'
  ANSIBLE_VERSION: '8.5.0'
  PYTHON_VERSION: '3.12'

jobs:
  # ==============================================
  # TERRAFORM VALIDATION
  # ==============================================
  terraform-validate:
    name: Terraform Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: TFLint Setup
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: TFLint Init
        run: tflint --init

      - name: TFLint Run
        id: tflint
        run: tflint --format compact
        continue-on-error: true

      - name: Comment PR with Terraform Results
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fmt_result = '${{ steps.fmt.outcome }}' === 'success' ? '✅ Passed' : '❌ Failed';
            const validate_result = '${{ steps.validate.outcome }}' === 'success' ? '✅ Passed' : '❌ Failed';
            const tflint_result = '${{ steps.tflint.outcome }}' === 'success' ? '✅ Passed' : '⚠️ Warnings';

            const output = `#### Terraform Validation Results 🏗️

            | Check | Status |
            |-------|--------|
            | Format Check | ${fmt_result} |
            | Validate | ${validate_result} |
            | TFLint | ${tflint_result} |

            <details><summary>Show Details</summary>

            **Format Check:**
            \`\`\`
            ${{ steps.fmt.outcome === 'success' ? 'All files properly formatted' : 'Some files need formatting. Run: terraform fmt -recursive' }}
            \`\`\`

            **Validate:**
            \`\`\`
            ${{ steps.validate.outputs.stdout || 'Validation passed' }}
            \`\`\`

            </details>

            *Terraform version: ${{ env.TF_VERSION }}*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

  # ==============================================
  # ANSIBLE VALIDATION
  # ==============================================
  ansible-validate:
    name: Ansible Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Ansible and ansible-lint
        run: |
          python -m pip install --upgrade pip
          pip install ansible==${{ env.ANSIBLE_VERSION }} ansible-lint yamllint
          ansible-galaxy collection install community.docker

      - name: Ansible Syntax Check - site.yml
        id: syntax_site
        working-directory: ansible
        run: |
          mkdir -p inventory
          echo "[monitoring]" > inventory/hosts.ini
          echo "127.0.0.1 ansible_user=ubuntu" >> inventory/hosts.ini
          ansible-playbook -i inventory/hosts.ini playbooks/site.yml --syntax-check
        continue-on-error: true

      - name: Ansible Syntax Check - cleanup.yml
        id: syntax_cleanup
        working-directory: ansible
        run: |
          ansible-playbook -i inventory/hosts.ini playbooks/cleanup.yml --syntax-check
        continue-on-error: true

      - name: Ansible Lint
        id: lint
        working-directory: ansible
        run: |
          ansible-lint playbooks/ roles/ || true
        continue-on-error: true

      - name: YAML Lint - Ansible
        id: yamllint
        run: |
          yamllint -c .yamllint.yml ansible/ || true
        continue-on-error: true

      - name: Check Ansible Galaxy Requirements
        id: galaxy
        run: |
          if [ -f ansible/requirements.yml ]; then
            ansible-galaxy collection install -r ansible/requirements.yml
            echo "galaxy_status=✅ All collections available" >> $GITHUB_OUTPUT
          else
            echo "galaxy_status=ℹ️ No requirements.yml found" >> $GITHUB_OUTPUT
          fi

      - name: Comment PR with Ansible Results
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const syntax_site = '${{ steps.syntax_site.outcome }}' === 'success' ? '✅ Passed' : '❌ Failed';
            const syntax_cleanup = '${{ steps.syntax_cleanup.outcome }}' === 'success' ? '✅ Passed' : '❌ Failed';
            const lint_status = '${{ steps.lint.outcome }}' === 'success' ? '✅ Passed' : '⚠️ Warnings';
            const yaml_status = '${{ steps.yamllint.outcome }}' === 'success' ? '✅ Passed' : '⚠️ Issues';

            const output = `#### Ansible Validation Results 🔧

            | Check | Status |
            |-------|--------|
            | Syntax Check (site.yml) | ${syntax_site} |
            | Syntax Check (cleanup.yml) | ${syntax_cleanup} |
            | Ansible Lint | ${lint_status} |
            | YAML Lint | ${yaml_status} |
            | Galaxy Collections | ${{ steps.galaxy.outputs.galaxy_status || 'ℹ️ Checked' }} |

            **Playbooks validated:**
            - \`ansible/playbooks/site.yml\`
            - \`ansible/playbooks/cleanup.yml\`

            **Roles validated:**
            - prometheus
            - grafana
            - alertmanager
            - blackbox-exporter
            - node-exporter
            - docker

            *Ansible version: ${{ env.ANSIBLE_VERSION }}*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

  # ==============================================
  # SHELL SCRIPT VALIDATION
  # ==============================================
  shellcheck:
    name: Shell Script Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run ShellCheck
        id: shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

          # Find all shell scripts
          find scripts/ -type f -name "*.sh" -print0 | while IFS= read -r -d '' file; do
            echo "Checking: $file"
            shellcheck -x "$file" || echo "Issues found in $file"
          done
        continue-on-error: true

      - name: Check Script Permissions
        id: permissions
        run: |
          echo "Checking script executability..."
          missing_exec=""
          for script in scripts/*.sh; do
            if [ ! -x "$script" ]; then
              echo "❌ Not executable: $script"
              missing_exec="$missing_exec\n- $script"
            else
              echo "✅ Executable: $script"
            fi
          done

          if [ -n "$missing_exec" ]; then
            echo "missing_exec<<EOF" >> $GITHUB_OUTPUT
            echo -e "$missing_exec" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "has_issues=true" >> $GITHUB_OUTPUT
          else
            echo "has_issues=false" >> $GITHUB_OUTPUT
          fi

      - name: Comment PR with ShellCheck Results
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const shellcheck_status = '${{ steps.shellcheck.outcome }}' === 'success' ? '✅ Passed' : '⚠️ Warnings';
            const perm_status = '${{ steps.permissions.outputs.has_issues }}' === 'false' ? '✅ All scripts executable' : '❌ Some scripts not executable';

            let missing_exec = '';
            if ('${{ steps.permissions.outputs.missing_exec }}') {
              missing_exec = `\n**Scripts missing executable permission:**\n${{ steps.permissions.outputs.missing_exec }}`;
            }

            const output = `#### Shell Script Validation Results 📝

            | Check | Status |
            |-------|--------|
            | ShellCheck | ${shellcheck_status} |
            | Executability | ${perm_status} |

            **Scripts checked:**
            - \`scripts/cleanup.sh\`
            ${missing_exec}

            <details><summary>Fix executable permissions</summary>

            \`\`\`bash
            chmod +x scripts/*.sh
            git add scripts/*.sh
            git commit -m "Fix script permissions"
            \`\`\`

            </details>`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

  # ==============================================
  # CONFIGURATION VALIDATION
  # ==============================================
  config-validate:
    name: Configuration Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install yq and promtool
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

          # Install Prometheus for promtool
          wget https://github.com/prometheus/prometheus/releases/download/v2.48.1/prometheus-2.48.1.linux-amd64.tar.gz
          tar xvfz prometheus-2.48.1.linux-amd64.tar.gz
          sudo cp prometheus-2.48.1.linux-amd64/promtool /usr/local/bin/
          sudo chmod +x /usr/local/bin/promtool

      - name: Validate Prometheus Config
        id: prometheus_config
        run: |
          if [ -f configs/prometheus/prometheus.yml ]; then
            promtool check config configs/prometheus/prometheus.yml
            echo "status=✅ Valid" >> $GITHUB_OUTPUT
          else
            echo "status=⚠️ File not found" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Validate Alert Rules
        id: alert_rules
        run: |
          if [ -f configs/prometheus/alert-rules.yml ]; then
            promtool check rules configs/prometheus/alert-rules.yml
            echo "status=✅ Valid" >> $GITHUB_OUTPUT
          else
            echo "status=⚠️ File not found" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Validate Custom Jobs YAML
        id: custom_jobs
        run: |
          if [ -f configs/prometheus/custom-jobs.yml ]; then
            yq eval configs/prometheus/custom-jobs.yml > /dev/null
            echo "status=✅ Valid YAML" >> $GITHUB_OUTPUT
          else
            echo "status=⚠️ File not found" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Validate AlertManager Config
        id: alertmanager_config
        run: |
          if [ -f configs/alertmanager/alertmanager.yml ]; then
            # Basic YAML validation
            yq eval configs/alertmanager/alertmanager.yml > /dev/null
            echo "status=✅ Valid YAML" >> $GITHUB_OUTPUT
          else
            echo "status=ℹ️ File not found (optional)" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Comment PR with Config Results
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `#### Configuration Validation Results ⚙️

            | Config File | Status |
            |-------------|--------|
            | Prometheus | ${{ steps.prometheus_config.outputs.status || '⚠️ Not checked' }} |
            | Alert Rules | ${{ steps.alert_rules.outputs.status || '⚠️ Not checked' }} |
            | Custom Jobs | ${{ steps.custom_jobs.outputs.status || '⚠️ Not checked' }} |
            | AlertManager | ${{ steps.alertmanager_config.outputs.status || 'ℹ️ Optional' }} |

            **Validated with:**
            - \`promtool\` (Prometheus v2.48.1)
            - \`yq\` (YAML validator)`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

  # ==============================================
  # SECURITY SCANNING
  # ==============================================
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true

      - name: Run TFSec
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          working_directory: terraform
          soft_fail: true

      - name: Check for Secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
        continue-on-error: true

      - name: Comment PR with Security Results
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `#### Security Scan Results 🔒

            | Scanner | Status |
            |---------|--------|
            | Trivy (Config Scan) | ✅ Completed |
            | TFSec (Terraform) | ✅ Completed |
            | TruffleHog (Secrets) | ✅ Completed |

            **Scanned for:**
            - Infrastructure misconfigurations
            - Terraform security issues
            - Exposed secrets and credentials

            ⚠️ Review any security warnings above before merging.`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

  # ==============================================
  # DOCUMENTATION CHECK
  # ==============================================
  docs-check:
    name: Documentation Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for broken links in markdown
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          use-verbose-mode: 'no'
          config-file: '.markdown-link-check.json'
        continue-on-error: true

      - name: Validate README structure
        id: readme_check
        run: |
          required_sections=(
            "## Overview"
            "## Features"
            "## Quick Start"
            "## Usage"
          )

          missing_sections=""
          for section in "${required_sections[@]}"; do
            if ! grep -q "$section" README.md; then
              echo "Missing: $section"
              missing_sections="$missing_sections\n- $section"
            fi
          done

          if [ -n "$missing_sections" ]; then
            echo "has_issues=true" >> $GITHUB_OUTPUT
            echo "missing<<EOF" >> $GITHUB_OUTPUT
            echo -e "$missing_sections" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "has_issues=false" >> $GITHUB_OUTPUT
          fi

      - name: Check if docs are up to date
        id: docs_updated
        run: |
          # Check if code changes require doc updates
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '(ansible|terraform|scripts)/' > /dev/null; then
            if ! git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '(README.md|docs/)' > /dev/null; then
              echo "needs_update=⚠️ Consider updating documentation" >> $GITHUB_OUTPUT
            else
              echo "needs_update=✅ Docs updated" >> $GITHUB_OUTPUT
            fi
          else
            echo "needs_update=ℹ️ No code changes" >> $GITHUB_OUTPUT
          fi

      - name: Comment PR with Docs Results
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const readme_status = '${{ steps.readme_check.outputs.has_issues }}' === 'false' ? '✅ All required sections present' : '⚠️ Missing sections';

            const output = `#### Documentation Check Results 📚

            | Check | Status |
            |-------|--------|
            | Markdown Links | ✅ Checked |
            | README Structure | ${readme_status} |
            | Docs Updated | ${{ steps.docs_updated.outputs.needs_update || 'ℹ️ Checked' }} |

            **Documentation files:**
            - README.md
            - docs/CLEANUP_GUIDE.md
            - docs/PROMETHEUS_JOBS_MANAGEMENT.md`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

  # ==============================================
  # SUMMARY
  # ==============================================
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [terraform-validate, ansible-validate, shellcheck, config-validate, security-scan, docs-check]
    if: always()

    steps:
      - name: Check test results
        run: |
          echo "Terraform: ${{ needs.terraform-validate.result }}"
          echo "Ansible: ${{ needs.ansible-validate.result }}"
          echo "ShellCheck: ${{ needs.shellcheck.result }}"
          echo "Config: ${{ needs.config-validate.result }}"
          echo "Security: ${{ needs.security-scan.result }}"
          echo "Docs: ${{ needs.docs-check.result }}"

      - name: Comment PR with Summary
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const getStatus = (result) => {
              if (result === 'success') return '✅ Passed';
              if (result === 'failure') return '❌ Failed';
              return '⚠️ Warning';
            };

            const output = `## PR Test Summary 📊

            | Test Suite | Result |
            |------------|--------|
            | Terraform Validation | ${getStatus('${{ needs.terraform-validate.result }}')} |
            | Ansible Validation | ${getStatus('${{ needs.ansible-validate.result }}')} |
            | Shell Scripts | ${getStatus('${{ needs.shellcheck.result }}')} |
            | Configuration Files | ${getStatus('${{ needs.config-validate.result }}')} |
            | Security Scan | ${getStatus('${{ needs.security-scan.result }}')} |
            | Documentation | ${getStatus('${{ needs.docs-check.result }}')} |

            ---

            See individual test comments above for detailed results.

            **Next Steps:**
            - ✅ All checks passed: Ready to merge
            - ❌ Some checks failed: Review and fix issues
            - ⚠️ Warnings present: Review before merging

            *Automated by GitHub Actions*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Fail if critical tests failed
        if: needs.terraform-validate.result == 'failure' || needs.ansible-validate.result == 'failure'
        run: |
          echo "❌ Critical tests failed"
          exit 1
