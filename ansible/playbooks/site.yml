---
# Main Ansible Playbook for Monitoring Infrastructure
# Deploys Prometheus, Grafana, and AlertManager using Docker Compose

- name: Deploy Complete Monitoring Stack
  hosts: monitoring
  become: true
  gather_facts: true

  vars:
    prometheus_version: "v2.48.1"
    grafana_version: "10.2.3"
    alertmanager_version: "v0.26.0"
    prometheus_retention: "30d"
    grafana_admin_password: "{{ lookup('env', 'GRAFANA_ADMIN_PASSWORD') | default('admin', true) }}"

  pre_tasks:
    - name: Wait for cloud-init to complete
      ansible.builtin.wait_for:
        path: /var/log/user-data-complete.log
        timeout: 600
        msg: "Waiting for user-data script to complete..."

    - name: Verify Docker is installed
      command: docker --version
      register: docker_version
      changed_when: false

    - name: Display Docker version
      debug:
        msg: "Docker is installed: {{ docker_version.stdout }}"

  roles:
    - prometheus
    - grafana
    - alertmanager
    - node-exporter
    - blackbox-exporter

  tasks:
    - name: Ensure monitoring directory exists
      become: yes
      file:
        path: /opt/monitoring
        state: directory
        mode: '0755'

    - name: Verify node_exporter is running
      become: yes
      systemd:
        name: prometheus-node-exporter
        state: started
        enabled: yes

    - name: Check node_exporter is accessible
      uri:
        url: http://localhost:9100/metrics
        status_code: 200
      retries: 3
      delay: 2
      register: node_exporter_check
      until: node_exporter_check.status == 200

    - name: Create docker-compose.yml file
      become: yes
      copy:
        content: |
          version: '3.8'

          services:
            prometheus:
              image: prom/prometheus:{{ prometheus_version }}
              container_name: prometheus
              restart: unless-stopped
              ports:
                - "9090:9090"
              volumes:
                - /etc/prometheus:/etc/prometheus
                - /var/lib/prometheus:/prometheus
              command:
                - '--config.file=/etc/prometheus/prometheus.yml'
                - '--storage.tsdb.path=/prometheus'
                - '--storage.tsdb.retention.time={{ prometheus_retention }}'
                - '--web.console.libraries=/usr/share/prometheus/console_libraries'
                - '--web.console.templates=/usr/share/prometheus/consoles'
                - '--web.enable-lifecycle'
              networks:
                - monitoring

            grafana:
              image: grafana/grafana:{{ grafana_version }}
              container_name: grafana
              restart: unless-stopped
              ports:
                - "3000:3000"
              volumes:
                - /var/lib/grafana:/var/lib/grafana
                - /etc/grafana:/etc/grafana/provisioning
              environment:
                - GF_SECURITY_ADMIN_PASSWORD={{ grafana_admin_password }}
                - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource,grafana-piechart-panel
                - GF_SERVER_ROOT_URL=http://{{ ansible_host }}:3000
              networks:
                - monitoring

            alertmanager:
              image: prom/alertmanager:{{ alertmanager_version }}
              container_name: alertmanager
              restart: unless-stopped
              ports:
                - "9093:9093"
              volumes:
                - /etc/alertmanager:/etc/alertmanager
                - /var/lib/alertmanager:/alertmanager
              command:
                - '--config.file=/etc/alertmanager/alertmanager.yml'
                - '--storage.path=/alertmanager'
              networks:
                - monitoring

            blackbox-exporter:
              image: prom/blackbox-exporter:latest
              container_name: blackbox-exporter
              restart: unless-stopped
              ports:
                - "9115:9115"
              volumes:
                - /etc/blackbox_exporter:/config
              command:
                - '--config.file=/config/config.yml'
              networks:
                - monitoring

          networks:
            monitoring:
              driver: bridge
        dest: /opt/monitoring/docker-compose.yml
        mode: '0644'

    - name: Deploy monitoring stack with Docker Compose
      become: yes
      shell: |
        cd /opt/monitoring
        docker compose up -d
      args:
        creates: /opt/monitoring/.deployed
      register: compose_result

    - name: Mark deployment as complete
      become: yes
      file:
        path: /opt/monitoring/.deployed
        state: touch
        mode: '0644'
      when: compose_result.changed

    - name: Wait for containers to start
      pause:
        seconds: 10

    - name: Check Docker containers status
      become: yes
      shell: docker ps -a --format 'table {{"{{"}}.Names{{"}}"}}\t{{"{{"}}.Status{{"}}"}}\t{{"{{"}}.Ports{{"}}"}}'
      register: docker_status
      changed_when: false

    - name: Display Docker status
      debug:
        var: docker_status.stdout_lines

    - name: Check blackbox-exporter logs if container exists
      become: yes
      command: docker logs blackbox-exporter --tail 50
      register: blackbox_logs
      failed_when: false

    - name: Display blackbox-exporter logs
      debug:
        var: blackbox_logs.stdout_lines
      when: blackbox_logs.rc == 0

    - name: Wait for Prometheus to be ready
      uri:
        url: "http://localhost:9090/-/ready"
        status_code: 200
      retries: 30
      delay: 5
      register: result
      until: result.status == 200

    - name: Wait for Grafana to be ready
      uri:
        url: "http://localhost:3000/api/health"
        status_code: 200
      retries: 30
      delay: 5
      register: result
      until: result.status == 200

    - name: Wait for Blackbox Exporter to be ready
      uri:
        url: "http://localhost:9115/metrics"
        status_code: 200
      retries: 10
      delay: 3
      register: blackbox_result
      until: blackbox_result.status == 200
      failed_when: false

    - name: Display Blackbox Exporter status
      debug:
        msg: >-
          {% if blackbox_result.status == 200 %}
          ✓ Blackbox Exporter is running
          {% else %}
          ⚠ Blackbox Exporter failed to start - check logs with: docker logs blackbox-exporter
          This is optional and won't prevent deployment from completing.
          {% endif %}

    - name: Display access information
      debug:
        msg:
          - "========================================="
          - "Monitoring Stack Deployed Successfully!"
          - "========================================="
          - "Core Services:"
          - "  Prometheus: http://{{ ansible_host }}:9090"
          - "  Grafana: http://{{ ansible_host }}:3000"
          - "  AlertManager: http://{{ ansible_host }}:9093"
          - ""
          - "Exporters:"
          - "  Node Exporter: http://{{ ansible_host }}:9100/metrics"
          - "  Blackbox Exporter: http://{{ ansible_host }}:9115/metrics"
          - ""
          - "Grafana Credentials:"
          - "  Username: admin"
          - "  Password: {{ grafana_admin_password }}"
          - ""
          - "Prometheus Targets: http://{{ ansible_host }}:9090/targets"
          - "========================================="
