---
# Configure Prometheus

- name: Create Prometheus directories
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
    owner: nobody
    group: nogroup
  loop:
    - /etc/prometheus
    - /etc/prometheus/rules
    - /var/lib/prometheus

- name: Copy Prometheus configuration
  copy:
    src: "{{ playbook_dir }}/../configs/prometheus/prometheus.yml"
    dest: /etc/prometheus/prometheus.yml
    mode: '0644'
  notify: reload prometheus

- name: Copy Prometheus alert rules
  copy:
    src: "{{ playbook_dir }}/../configs/prometheus/alert-rules.yml"
    dest: /etc/prometheus/rules/alert-rules.yml
    mode: '0644'
  notify: reload prometheus

- name: Ensure Prometheus data directory has correct permissions
  file:
    path: /var/lib/prometheus
    state: directory
    mode: '0755'
    owner: nobody
    group: nogroup
    recurse: yes
