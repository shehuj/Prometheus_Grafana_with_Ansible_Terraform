---
# Configure Grafana

- name: Create Grafana directories
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /var/lib/grafana
    - /etc/grafana
    - /etc/grafana/datasources
    - /etc/grafana/dashboards

- name: Copy Grafana datasource configuration
  copy:
    src: "{{ playbook_dir }}/../configs/grafana/datasources.yml"
    dest: /etc/grafana/datasources/datasources.yml
    mode: '0644'

- name: Ensure Grafana data directory has correct permissions
  file:
    path: /var/lib/grafana
    state: directory
    mode: '0755'
    owner: '472'
    group: '472'
    recurse: yes
