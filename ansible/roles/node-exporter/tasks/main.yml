---
# Configure Node Exporter

- name: Install Node Exporter
  apt:
    name: prometheus-node-exporter
    state: present
    update_cache: yes
  register: node_exporter_install

- name: Stop Node Exporter if it auto-started
  systemd:
    name: prometheus-node-exporter
    state: stopped
  when: node_exporter_install.changed
  ignore_errors: yes

- name: Check if port 9100 is already in use
  shell: netstat -tlnp | grep :9100 || true
  register: port_check
  changed_when: false

- name: Display port status
  debug:
    msg: "Port 9100 status: {{ port_check.stdout if port_check.stdout else 'Available' }}"

- name: Check systemd unit file
  command: systemctl cat prometheus-node-exporter
  register: systemd_unit
  changed_when: false
  failed_when: false

- name: Display systemd unit configuration
  debug:
    var: systemd_unit.stdout_lines
  when: systemd_unit.stdout_lines is defined

- name: Configure Node Exporter to listen on all interfaces
  lineinfile:
    path: /etc/default/prometheus-node-exporter
    regexp: '^ARGS='
    line: 'ARGS="--web.listen-address=:9100"'
    create: yes
  register: node_exporter_config

- name: Reload systemd daemon if config changed
  systemd:
    daemon_reload: yes
  when: node_exporter_config.changed

- name: Ensure Node Exporter is running
  systemd:
    name: prometheus-node-exporter
    state: started
    enabled: yes
    daemon_reload: yes
  register: node_exporter_start
  failed_when: false

- name: Get Node Exporter service status
  command: systemctl status prometheus-node-exporter --no-pager -l
  register: node_exporter_status
  changed_when: false
  failed_when: false

- name: Display Node Exporter service status
  debug:
    msg: "{{ node_exporter_status.stdout_lines }}"

- name: Get Node Exporter journal logs
  command: journalctl -xeu prometheus-node-exporter -n 100 --no-pager
  register: node_exporter_logs
  changed_when: false
  failed_when: false

- name: Display Node Exporter logs
  debug:
    msg: "{{ node_exporter_logs.stdout_lines }}"

- name: Check config file
  command: cat /etc/default/prometheus-node-exporter
  register: node_config_content
  changed_when: false
  failed_when: false

- name: Display config file
  debug:
    msg: "{{ node_config_content.stdout_lines }}"

- name: Verify Node Exporter is accessible
  uri:
    url: http://localhost:9100/metrics
    status_code: 200
  retries: 5
  delay: 2
  register: node_exporter_check
  until: node_exporter_check.status == 200
  failed_when: false

- name: Final Node Exporter status
  debug:
    msg: |
      Node Exporter Status:
      {% if node_exporter_check.status == 200 %}
      ✓ Node Exporter is running and accessible
      {% else %}
      ✗ Node Exporter is NOT accessible
      Service Status: {{ 'Active' if node_exporter_start.status is defined and node_exporter_start.status.ActiveState == 'active' else 'Inactive/Failed' }}
      Check the logs above for details
      {% endif %}
