[defaults]
# Ansible Configuration for Monitoring Infrastructure

# Roles path - where to look for roles
roles_path = ./roles:~/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles

# Inventory location
inventory = ./inventory/hosts.ini

# Don't create .retry files
retry_files_enabled = False

# Use the YAML callback plugin for better output
stdout_callback = yaml

# SSH settings
host_key_checking = False
timeout = 30

# Performance tuning
forks = 10
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_facts
fact_caching_timeout = 3600

[ssh_connection]
# SSH pipelining for better performance
pipelining = True

# Control path for connection reuse
control_path = /tmp/ansible-ssh-%%h-%%p-%%r
